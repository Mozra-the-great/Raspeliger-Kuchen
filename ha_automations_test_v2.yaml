# ============================================================
# RASPI CHALLENGE 2026 - Automationen TEST
# Timeouts: Buchung=10s, Person-weg=30s, No-Show=30s
# ============================================================

# ============================================================
# RAUM A - BUCHUNG KOMFORT TEST
# ============================================================
- id: "raum_a_buchung_komfort_test"
  alias: "Raum A - Buchung Komfort TEST"
  description: "[TEST] Komfort ein bei Buchung, aus nach 10s wenn niemand kommt"
  trigger:
    - platform: state
      entity_id: sensor.buchung_aktiv_a
      to: "on"
  action:
    - service: light.turn_on
      target:
        entity_id: light.licht_raum_a_2
    - service: cover.open_cover
      target:
        entity_id: cover.rollo_raum_a_2
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ now().month in [5,6,7,8,9] }}"
          sequence:
            - service: climate.set_hvac_mode
              target:
                entity_id: climate.klima_raum_a_2
              data:
                hvac_mode: cool
            - service: climate.set_temperature
              target:
                entity_id: climate.klima_raum_a_2
              data:
                temperature: 22
      default:
        - service: climate.set_hvac_mode
          target:
            entity_id: climate.klima_raum_a_2
          data:
            hvac_mode: heat
        - service: climate.set_temperature
          target:
            entity_id: climate.klima_raum_a_2
          data:
            temperature: 21
    - wait_template: "{{ is_state('binary_sensor.anwesenheit_raum_a', 'on') }}"
      timeout: "00:00:10"
      continue_on_timeout: true
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ not wait.completed and is_state('sensor.buchung_aktiv_a', 'on') }}"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.licht_raum_a_2
            - service: cover.close_cover
              target:
                entity_id: cover.rollo_raum_a_2
            - service: climate.set_hvac_mode
              target:
                entity_id: climate.klima_raum_a_2
              data:
                hvac_mode: "off"
  mode: restart


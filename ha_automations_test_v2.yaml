# ============================================================
# NO-SHOW AUTO-RELEASE TEST
# ============================================================
- id: "no_show_auto_release_test"
  alias: "No-Show Auto-Release TEST"
  description: "[TEST] Storniert Buchung wenn 30s niemand erscheint"
  trigger:
    - platform: state
      entity_id:
        - sensor.buchung_aktiv_a
        - sensor.buchung_aktiv_b
        - sensor.buchung_aktiv_c
        - sensor.buchung_aktiv_d
      to: "on"
  variables:
    raum_short: "{{ trigger.entity_id.split('_')[-1] }}"
    raum_id: "raum_{{ trigger.entity_id.split('_')[-1] }}"
    anwesenheit_entity: "binary_sensor.anwesenheit_raum_{{ trigger.entity_id.split('_')[-1] }}"
    buchung_entity: "{{ trigger.entity_id }}"
  action:
    - repeat:
        while:
          - condition: template
            value_template: "{{ is_state(buchung_entity, 'on') }}"
        sequence:
          - wait_template: "{{ is_state(anwesenheit_entity, 'on') }}"
            timeout: "00:00:30"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ wait.completed }}"
                sequence:
                  - wait_template: "{{ is_state(anwesenheit_entity, 'off') }}"
                    timeout: "02:00:00"
                    continue_on_timeout: true
            default:
              - condition: template
                value_template: "{{ is_state(buchung_entity, 'on') }}"
              - service: rest_command.raum_frei
                data:
                  raum_id: "{{ raum_id }}"
              - service: persistent_notification.create
                data:
                  title: "Auto-Release"
                  message: "Buchung Raum {{ raum_short | upper }} storniert - niemand erschienen."
  mode: parallel
  max: 4
  
